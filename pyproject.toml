[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "heatgate"
version = "0.1.0"
description = "Electron-flow heat throttle: CPU load as a stand-in for chip heat, with a built-in MCP server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []
authors = [{name = "Joshua Almeida"}]
keywords = ["throttle", "cpu", "load", "thermal", "mcp", "ai-agents"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: System :: Monitoring",
]
[project.urls]
Homepage = "https://github.com/fitzyracing1/heatgate"
Issues = "https://github.com/fitzyracing1/heatgate/issues"
[project.scripts]
heatgate = "heatgate.cli:main"
[tool.setuptools]
packages = ["heatgate"]
