[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "heatgate"
version = "0.1.0"
description = "Load-based throttle: CPU load as a stand-in for chip heat"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []
[project.scripts]
heatgate = "heatgate.cli:main"
[tool.setuptools]
packages = ["heatgate"]
